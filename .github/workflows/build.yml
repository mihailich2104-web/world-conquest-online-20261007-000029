name: Build EXE
on:
  push:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: WorldConquest-Windows
            path: dist/WorldConquest.exe
          - os: ubuntu-latest
            name: WorldConquest-Linux
            path: dist/WorldConquest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: SDL-зависимости (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python tools/prepare_map.py
      - run: python tools/gen_countries.py
      - run: python tests/test_core.py
      - run: python tests/test_tutorial.py
      - run: python tests/test_features.py
      - name: Тест LAN (сокеты на localhost)
        run: python tests/test_lan.py
        continue-on-error: ${{ runner.os == 'Windows' }}
      - name: Дымовой тест UI (без окна)
        run: python tests/test_smoke_ui.py
      - run: pyinstaller build/world_conquest.spec --clean --noconfirm
      - name: Создать Setup.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "dist/WorldConquest.exe" "dist/Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.path }}
            dist/Setup.exe
      - name: Карта мира как артефакт (для Termux/других сборок)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: world-data
          path: src/data/provinces.geojson


  installer:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Скачать Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: WorldConquest-Windows
          path: dist

      - name: Создать Setup.exe
        shell: pwsh
        run: |
          @"
          [Setup]
          AppName=World Conquest
          AppVersion=1.0.0
          DefaultDirName={autopf}\World Conquest
          DefaultGroupName=World Conquest
          OutputDir=installer
          OutputBaseFilename=Setup
          Compression=lzma
          SolidCompression=yes
          Uninstallable=yes

          [Files]
          Source: "dist\WorldConquest.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\World Conquest"; Filename: "{app}\WorldConquest.exe"
          Name: "{commondesktop}\World Conquest"; Filename: "{app}\WorldConquest.exe"

          [Run]
          Filename: "{app}\WorldConquest.exe"; Description: "Запустить World Conquest"; Flags: nowait postinstall skipifsilent
          "@ | Out-File installer.iss -Encoding utf8

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Загрузить Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: WorldConquest-Setup
          path: installer\Setup.exe
